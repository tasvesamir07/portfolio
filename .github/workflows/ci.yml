name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # 1. Dependency Installation
      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      # 2. Security Audits
      - name: Security audit (server)
        run: cd server && npm audit --audit-level=critical
        continue-on-error: true

      - name: Security audit (client)
        run: cd client && npm audit --audit-level=critical
        continue-on-error: true

      # 3. Code Quality (Lint)
      - name: Lint server
        run: cd server && npm run lint

      - name: Lint client
        run: cd client && npm run lint

      # 4. Unit Testing
      - name: Run server unit tests
        run: cd server && npm run test
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key_123456
          PURCHASE_EMAIL_USER: test@example.com
          PURCHASE_EMAIL_PASS: testpass

      - name: Run client unit tests
        run: cd client && npm run test

      # 5. Client Build & Bundle Size Check
      - name: Build client and verify bundle size
        run: cd client && npm run build
        env:
          VITE_API_URL: http://localhost:5000

      # 6. E2E Setup & Execution
      - name: Install Playwright browsers
        run: cd client && npx playwright install --with-deps

      - name: Start backend server
        run: |
          cd server
          npm run start:once &
        env:
          PORT: 5000
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/portfolio_test
          JWT_SECRET: test_secret_key_123456
          PURCHASE_EMAIL_USER: test@example.com
          PURCHASE_EMAIL_PASS: testpass
          UPSTASH_REDIS_REST_URL: http://localhost:6379
          UPSTASH_REDIS_REST_TOKEN: test_token

      - name: Start client preview
        run: |
          cd client
          npm run preview &

      - name: Wait for servers
        run: |
          npx wait-on http://localhost:5000/api/v1/ping http://localhost:5173 --timeout 60000

      - name: Run Playwright E2E tests
        run: cd client && npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30
